name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Confirm no draft skills were packaged
        run: |
          python - <<'EOF'
          import glob, sys, zipfile

          expected = {
              "cancer-multiomics",
              "immune-deconvolution",
              "survival-analysis",
              "single-cell-atlas",
              "spatial-transcriptomics",
              "foundation-models",
              "meta-analysis",
              "variant-annotation",
              "drug-response",
              "clinical-nlp",
              "computational-pathology",
          }
          wheel = glob.glob("dist/*.whl")[0]
          found = {
              n.split("/")[2]
              for n in zipfile.ZipFile(wheel).namelist()
              if n.startswith("biomedical_ai_skills/skills/")
          }
          if found != expected:
              print(f"unexpected: {found ^ expected}", file=sys.stderr)
              sys.exit(1)
          print(f"ok, {len(found)} skills packaged")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/biomedical-ai-skills
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
